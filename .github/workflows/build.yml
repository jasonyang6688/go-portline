name: Build Desktop Apps

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to publish, for example v0.1.3"
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Test
        run: go test ./...

      - name: Build Windows app and installer
        run: wails build -nsis

      - name: Package Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path build/bin/TermFlow.exe -Destination dist/TermFlow-windows-amd64.exe
          $installer = Get-ChildItem -Path build/bin -Filter "*installer*.exe" | Select-Object -First 1
          if ($installer) {
            Copy-Item -LiteralPath $installer.FullName -Destination dist/TermFlow-windows-amd64-installer.exe
          }
          Compress-Archive -Path dist/TermFlow-windows-amd64.exe -DestinationPath dist/TermFlow-windows-amd64-portable.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: TermFlow-windows-amd64
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Test
        run: go test ./...

      - name: Build macOS app
        run: wails build

      - name: Package macOS artifact
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/bin/TermFlow.app dist/TermFlow-macos.zip
          hdiutil create -volname "TermFlow" -srcfolder build/bin/TermFlow.app -ov -format UDZO dist/TermFlow-macos.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: TermFlow-macos
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="${RELEASE_TAG_INPUT}"
          fi

          if [[ ! "${release_tag}" =~ ^v[0-9]+(\.[0-9]+)*([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "release_tag must start with v and look like a version, for example v0.1.3" >&2
            exit 1
          fi

          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find dist -type f -maxdepth 3 -print -exec cp {} release-files/ \;
          find release-files -type f -maxdepth 1 -print
          test "$(find release-files -type f -maxdepth 1 | wc -l)" -gt 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_tag="${{ steps.release.outputs.tag }}"

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" release-files/* --clobber
          else
            gh release create "${release_tag}" release-files/* \
              --target "${GITHUB_SHA}" \
              --title "TermFlow ${release_tag}" \
              --notes "Desktop builds for Windows and macOS."
          fi
